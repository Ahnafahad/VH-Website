function renderActivity(a){const done=!!state.completed[a.id];const letters=['A','B','C','D','E'];return `<article class="activity" data-activity="${esc(a.id)}"><div class="activity-head"><div class="kind">${esc(a.kind)}</div><div class="status">${done?'previously solved':'try it'}</div></div><div class="activity-body"><div class="prompt" data-audit-sample="${esc(a.id)}">${esc(a.prompt)}</div><div class="options">${a.options.map((o,i)=>`<button class="opt" data-choice="${i}"><span class="key">${letters[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="feedback" aria-live="polite"><div class="fb-title"></div><p></p><button class="linkbtn deeper-btn" type="button" hidden>Why this works</button><div class="deeper"><p>${esc(a.deeper)}</p></div></div><div class="confidence"><span>How sure were you?</span><button class="conf" data-conf="low">Guessing</button><button class="conf" data-conf="medium">Fairly sure</button><button class="conf" data-conf="high">Certain</button></div></div></article>`}
function bindActivities(root=document){root.querySelectorAll('.activity').forEach(el=>{const a=byId(el.dataset.activity);if(!a)return;let encounterAttempts=0;const wasCompleted=!!state.completed[a.id];const feedback=el.querySelector('.feedback'),title=el.querySelector('.fb-title'),msg=feedback.querySelector('p'),conf=el.querySelector('.confidence'),deeperBtn=el.querySelector('.deeper-btn'),buttons=[...el.querySelectorAll('.opt')];buttons.forEach(btn=>btn.onclick=()=>{encounterAttempts++;const choice=Number(btn.dataset.choice);state.attempts[a.id]=(state.attempts[a.id]||0)+1;feedback.classList.add('show');if(choice===a.answer){btn.classList.add('correct');buttons.forEach(b=>b.disabled=true);title.textContent=encounterAttempts===1?'Good reasoning.':'Repaired.';msg.textContent=a.explain;deeperBtn.hidden=false;conf.classList.add('show');const canCredit=a.module==='review'||!wasCompleted;if(a.module!=='review')state.completed[a.id]=true;if(canCredit)awardSkill(a,encounterAttempts===1?10:5);scheduleReview(a.skill,encounterAttempts===1?'strong':'weak');if(a.module==='review')state.reviewCursor[a.skill]=(Number(state.reviewCursor[a.skill]||0)+1)}else{btn.classList.add('wrong');btn.disabled=true;title.textContent='Not yet.';msg.textContent=encounterAttempts===1?a.hint1:a.hint2;recordMistake(a,choice);awardSkill(a,-4);scheduleReview(a.skill,'weak')}queueSave();updateChrome()});deeperBtn.onclick=()=>el.querySelector('.deeper').classList.toggle('open');el.querySelectorAll('.conf').forEach(b=>b.onclick=()=>{const v=b.dataset.conf;state.confidence[a.id]=v;if(state.review[a.skill]){const r=state.review[a.skill];const remaining=Math.max(3600000,r.next-Date.now());r.next=Date.now()+remaining*(v==='low'?.45:v==='high'?1.15:1)}conf.querySelectorAll('.conf').forEach(x=>x.disabled=true);queueSave()})})}
function hero(kicker,title,lede){return `<div class="hero"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="lede">${lede}</p></div>`}
function renderHome(){const pct=totalProgress(),last=state.lastLearningRoute||'foundations';const weak=Object.entries(skillMeta).sort((a,b)=>(state.mastery[a[0]]||0)-(state.mastery[b[0]]||0)).slice(0,6);document.getElementById('homeContent').innerHTML=`${hero('BTH System · English · Chapter 5.1','Verb Tenses <span class="it">without guessing.</span>','Learn the time relationship first, then the form. The exam rarely rewards naming a tense; it rewards noticing when verbs agree—or clash—with the timeline.')}<div class="section"><div class="cards"><div class="card soft"><div class="tag">Continue your session</div><h3>${pct?'Pick up where you left off.':'Start with the four ideas beneath all twelve tenses.'}</h3><p>Your progress, attempts, weak skills, confidence and review timing stay on this device.</p><div class="btnrow"><button class="btn" data-go="${last}">Continue learning</button><button class="btn ghost" data-go="lab">Open review · ${dueSkills().length} due</button></div></div><div class="card"><div class="tag">Course scope</div><div class="plain">12 forms · 8 error patterns · mixed exam practice</div><p>The app preserves the lecture’s scope, but every worked example and practice item here is newly authored.</p></div></div></div><div class="section"><div class="section-head"><div><div class="eyebrow">How to use this</div><h2>Meaning → structure → repair → transfer.</h2></div><p>Do not memorise cue words as shortcuts. Use them to confirm a timeline you already understand.</p></div><div class="cards three"><div class="card"><div class="tag">1 · Notice</div><h3>Where is the reference point?</h3><p>Present, past or future tells you the time family.</p></div><div class="card"><div class="tag">2 · View</div><h3>How is the action framed?</h3><p>Plain event, in progress, linked across time, or continuing across that link.</p></div><div class="card"><div class="tag">3 · Test</div><h3>Does every verb fit the same timeline?</h3><p>In mixed sentences, different tenses can be correct when their meanings genuinely differ.</p></div></div></div><div class="section"><div class="section-head"><div><div class="eyebrow">Mastery map</div><h2>What needs the next review?</h2></div><p>First-try answers build mastery faster than repaired answers. Missed ideas return sooner.</p></div><div class="mastery-grid">${weak.map(([k,v])=>`<div class="skill"><div class="skill-head"><b>${esc(v)}</b><span>${masteryLabel(state.mastery[k]||0)}</span></div><div class="bar"><i style="width:${state.mastery[k]||0}%"></i></div></div>`).join('')}</div></div>`;bindGo(document.getElementById('homeContent'))}
function renderTenseExplorer(){return `<div class="card"><div class="tag">Interactive tense engine</div><h3>Choose the time. Then choose the viewpoint.</h3><p>Start from meaning. The formal label and formation appear after you make the two choices.</p><div class="btnrow" id="timeBtns">${['present','past','future'].map(t=>`<button class="btn ghost time-choice" data-time="${t}" aria-pressed="false">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div><div class="view-grid" id="viewBtns">${['Simple','Progressive','Perfect','Perfect Progressive'].map((v,i)=>`<button class="view-btn" data-view="${i}" aria-pressed="false"><b>${v}</b><small>${['plain event / fact','in progress','links two times','duration + time link'][i]}</small></button>`).join('')}</div><div class="view-result" id="viewResult" aria-live="polite"><div class="tag">Start here</div><p>Pick a time family and a viewpoint.</p></div></div>`}
function bindExplorer(){let t='present',v=null;const render=()=>{document.querySelectorAll('.time-choice').forEach(b=>{const on=b.dataset.time===t;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on?'true':'false')});document.querySelectorAll('.view-btn').forEach(b=>{const on=Number(b.dataset.view)===v;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on?'true':'false')});if(v===null)return;const c=tenseCards[t][v];document.getElementById('viewResult').innerHTML=`<div class="tag">${esc(c.name)}</div><p>${esc(c.meaning)}</p><span class="formula">${esc(c.formation)}</span><div class="example">${esc(c.example)}</div><div class="unsure"><b>Meaning cue:</b> ${esc(c.cue)}</div>`};document.querySelectorAll('.time-choice').forEach(b=>b.onclick=()=>{t=b.dataset.time;render()});document.querySelectorAll('.view-btn').forEach(b=>b.onclick=()=>{v=Number(b.dataset.view);render()});render()}
function normTyped(s){return String(s).toLowerCase().trim().replace(/[’']/g,"'").replace(/\s+/g,' ').replace(/\s*[/,;|]\s*/g,' / ')}
function typedLab(id,title,prompt,placeholder){return `<div class="typed-lab" data-typed="${esc(id)}"><div class="tag">Production check</div><h3>${esc(title)}</h3><label for="${esc(id)}-input">${esc(prompt)}</label><input id="${esc(id)}-input" type="text" autocomplete="off" placeholder="${esc(placeholder)}"><div class="btnrow" style="margin-top:10px"><button class="btn" id="${esc(id)}-check">Check my form</button></div><div class="typed-feedback" id="${esc(id)}-feedback" aria-live="polite"></div></div>`}
function bindTypedLab(id,accepted,hint,explain,skill){const input=document.getElementById(id+'-input'),btn=document.getElementById(id+'-check'),fb=document.getElementById(id+'-feedback');if(!input||!btn||!fb)return;btn.onclick=()=>{const val=normTyped(input.value),ok=accepted.map(normTyped).includes(val);fb.classList.add('show');if(ok){fb.innerHTML=`<div class="callout success"><b>Correct.</b><p>${esc(explain)}</p></div>`;if(!state.labs[id]){state.labs[id]=true;scoreSkill(skill,6);scheduleReview(skill,'strong')}}else{fb.innerHTML=`<div class="callout warn"><b>Not yet.</b><p>${esc(hint)}</p></div>`}queueSave();updateChrome()}}
function renderFoundations(){document.getElementById('foundationsContent').innerHTML=`${hero('01 · Tense Foundations','Time is only <span class="it">half</span> the story.','Present, past and future tell you where the reference point sits. Simple, progressive, perfect and perfect progressive tell you how the action is viewed around that point.')}<div class="section"><div class="section-head"><div><div class="eyebrow">The four ideas</div><h2>Learn the meaning before the label.</h2></div><p>The same four viewpoints repeat across present, past and future. Once these make sense, the twelve forms stop feeling like twelve unrelated rules.</p></div><div class="cards"><div class="card"><div class="tag">Simple</div><h3>Plain event, fact or state.</h3><p>No special emphasis on an action being in progress or on a time link.</p></div><div class="card"><div class="tag">Progressive</div><h3>Open the action up.</h3><p>View the action as unfolding at the reference time—more like a video than a single finished frame.</p></div><div class="card"><div class="tag">Perfect</div><h3>Link one time to another.</h3><p>Look back from a reference point to something earlier that matters to it.</p></div><div class="card"><div class="tag">Perfect progressive</div><h3>Keep the action running across the link.</h3><p>Show an activity continuing up to a reference point, usually with duration made important.</p></div></div></div><div class="section">${renderTenseExplorer()}</div><div class="section"><div class="section-head"><div><div class="eyebrow">Guided retrieval</div><h2>Try, receive a hint, repair.</h2></div><p>The correct option is not exposed after a first miss. Use the hint to re-read the timeline.</p></div>${activities.filter(a=>a.module==='foundations').map(renderActivity).join('')}</div><div class="section teach"><div class="section-head"><div><div class="eyebrow">Teach the tutor</div><h2>Explain the four viewpoints in your own words.</h2></div><p>If you can explain the difference without using the labels, the labels will be much easier to remember.</p></div><textarea id="note-foundations" aria-label="Explain the four tense viewpoints in your own words" placeholder="Simple means… Progressive means… Perfect means… Perfect progressive means…"></textarea></div>`;bindActivities(document.getElementById('foundationsContent'));bindExplorer();bindNote('note-foundations')}
function familyIntro(time,title,lede){return `${hero('',title,lede)}<div class="section"><div class="section-head"><div><div class="eyebrow">Four forms</div><h2>Same time family, four different viewpoints.</h2></div><p>Read the meaning column first. Use the formation only after you know what relationship the sentence needs.</p></div><div class="tense-table">${tenseCards[time].map(c=>`<article class="tense-card"><div class="tag">${esc(c.name)}</div><p>${esc(c.meaning)}</p><div class="formation">${esc(c.formation)}</div><div class="example">${esc(c.example)}</div><div class="cue"><b>When unsure:</b> ${esc(c.cue)}</div></article>`).join('')}</div></div>`}
function renderPresent(){document.getElementById('presentContent').innerHTML=`${familyIntro('present','The Present Family','The present family handles general truths and routines, actions unfolding now or around now, planned future arrangements with a time expression, and earlier actions whose connection reaches the present.')}<div class="section"><div class="callout"><div class="tag">When unsure</div><h3>Ask whether the sentence is about a routine, a temporary current action, a past-to-present link, or an ongoing duration.</h3><p>Stative verbs need special care: many do not normally take progressive forms in formal written English.</p></div><div class="callout" style="margin-top:14px"><div class="tag">Dialect note</div><p>The lecture notes that American English often uses simple past in some situations where British English prefers present perfect. Follow the course convention in exam work unless the question clearly signals another register.</p></div></div><div class="section">${typedLab('present-plan','Build a planned arrangement','Complete only the verb phrase: “The research group ___ (meet) the sponsor at 4 tomorrow.”','is meeting')}<div style="height:14px"></div>${activities.filter(a=>a.module==='present').map(renderActivity).join('')}</div>`;bindActivities(document.getElementById('presentContent'));bindTypedLab('present-plan',['is meeting'],'The time is future, but this is a planned arrangement with a stated time. Use present progressive.','“Is meeting” uses present progressive to express a planned future arrangement with a time expression.','present-family')}
function renderPast(){document.getElementById('pastContent').innerHTML=`${familyIntro('past','The Past Family','Past forms do more than say “it happened before now”. They can show a finished or repeated past event, an ended past state, background or simultaneous actions in progress, an earlier past action, or duration leading up to a past point.')}<div class="section"><div class="callout"><div class="tag">When unsure</div><h3>Count the past actions, then put them on a timeline.</h3><p>Past perfect marks the earlier of two meaningful past points. Do not turn every earlier event into past perfect automatically.</p></div></div><div class="section">${typedLab('past-pair','Build simultaneous past actions','Complete the two verb phrases: “While one technician ___ (check) the valves, another ___ (log) the readings.”','was checking / was logging')}<div style="height:14px"></div>${activities.filter(a=>a.module==='past').map(renderActivity).join('')}</div>`;bindActivities(document.getElementById('pastContent'));bindTypedLab('past-pair',['was checking / was logging'],'Both activities are unfolding at the same past time. Use past progressive for each.','“Was checking / was logging” shows two simultaneous past activities in progress.','past-family')}
function renderFuture(){document.getElementById('futureContent').innerHTML=`${familyIntro('future','The Future Family','Future grammar depends on what kind of future meaning you need: statement or prediction, evidence-based outcome, action in progress—including parallel future activities—or completion by a later future point.')}<div class="section"><div class="cards"><div class="card soft"><div class="tag">Fixed schedules</div><h3>Present can still refer to the future.</h3><p>A timetable such as a train, class, conference or published schedule commonly uses simple present.</p></div><div class="card"><div class="tag">Dependent clauses</div><h3>Future meaning does not always take will.</h3><p>After when, before, after and similar future time clauses—and in ordinary future conditions—the dependent clause normally stays present.</p></div></div></div><div class="section">${typedLab('future-pair','Build a future scene','Complete the two verb phrases: “At noon, one team ___ (test) the pumps while another ___ (record) pressure levels.”','will be testing / will be recording')}<div style="height:14px"></div>${activities.filter(a=>a.module==='future').map(renderActivity).join('')}</div>`;bindActivities(document.getElementById('futureContent'));bindTypedLab('future-pair',['will be testing / will be recording'],'Both activities are expected to be unfolding at the same future time.','“Will be testing / will be recording” uses future progressive for two parallel future activities.','future-family')}
function renderMemorise(){const rows=[...tenseCards.present,...tenseCards.past,...tenseCards.future];document.getElementById('memoriseContent').innerHTML=`${hero('05 · What to Memorise','Memorise the <span class="it">pattern</span>, not twelve isolated strings.','Three time families × four viewpoints gives the whole system. Keep a short stative list ready because progressive forms are a common exam trap.')}<div class="section"><div class="section-head"><div><div class="eyebrow">Formation table</div><h2>The twelve forms at one glance.</h2></div><p>Use this as a reference after you understand the meanings. It is not a replacement for the timeline.</p></div><div class="matrix"><table><thead><tr><th>Tense</th><th>Formation</th><th>Core use</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td><span class="formula">${esc(r.formation)}</span></td><td>${esc(r.meaning)}</td></tr>`).join('')}</tbody></table></div></div><div class="section"><div class="section-head"><div><div class="eyebrow">Stative verbs</div><h2>Rarely progressive in formal written English.</h2></div><p>The lecture specifically asks you to treat progressive uses of these as errors in formal writing, while recognising that informal or promotional English can sometimes be more flexible.</p></div><div class="stative-list">${stativeVerbs.map(v=>`<span class="chip">${esc(v)}</span>`).join('')}</div></div><div class="section"><div class="callout"><div class="tag">Irregular forms</div><h3>Do not assume past form = past participle.</h3><p>The lecture flags irregular past forms as heavily tested. Learn common verbs as a three-part family, such as write → wrote → written, because perfect tenses need the past participle.</p></div></div><div class="section">${typedLab('irregular-pair','Build an irregular pair','Complete the two forms only: “Yesterday she ___ the note; by noon she had ___ the appendix.”','wrote / written')}<div style="height:14px"></div>${activities.filter(a=>a.module==='memorise').map(renderActivity).join('')}</div>`;bindActivities(document.getElementById('memoriseContent'));bindTypedLab('irregular-pair',['wrote / written'],'The first blank is simple past; after had, use the past participle.','“Wrote / written” distinguishes the irregular simple-past form from the past participle.','past-family')}
function renderErrors(){document.getElementById('errorsContent').innerHTML=`${hero('06 · Common Errors','This is where the <span class="it">exam lives.</span>','For each error, learn what the sentence is trying to express, how to spot the mismatch, and what to do when two forms both look tempting.')}<div class="section"><div class="error-grid">${errorLessons.map(e=>`<article class="error-card"><div class="num">ERROR ${e.n}</div><h3>${esc(e.title)}</h3><p>${esc(e.how)}</p><div class="unsure"><b>When unsure:</b> ${esc(e.unsure)}</div></article>`).join('')}</div></div><div class="section"><div class="section-head"><div><div class="eyebrow">Repair practice</div><h2>Find the time relationship, then fix the verb.</h2></div><p>The first hint points your attention. The second narrows the comparison. Only then should you commit to the repair.</p></div>${activities.filter(a=>a.module==='errors').map(renderActivity).join('')}</div>`;bindActivities(document.getElementById('errorsContent'))}
function topMistakes(){const c={};state.mistakes.filter(m=>m.tag&&m.tag!=='unspecified').forEach(m=>c[m.tag]=(c[m.tag]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6)}
function selectReviewItem(skill){const variants=reviewItems.filter(a=>a.skill===skill);if(!variants.length)return null;const i=Math.max(0,Math.floor(Number(state.reviewCursor[skill]||0)))%variants.length;return variants[i]}function buildReview(){const due=dueSkills(),weak=Object.keys(skillMeta).sort((a,b)=>(state.mastery[a]||0)-(state.mastery[b]||0));const skills=[...new Set([...due,...weak])].slice(0,8);const items=skills.map(selectReviewItem).filter(Boolean);const z=document.getElementById('reviewZone');z.innerHTML=items.length?items.map(renderActivity).join(''):'<p style="margin-top:14px">Nothing is due yet. The least-secure skills will still be offered when appropriate.</p>';bindActivities(z)}
function renderLab(){const mistakes=topMistakes();document.getElementById('labContent').innerHTML=`${hero('07 · Exam Lab','Now the rule names <span class="it">disappear.</span>','Sentence correction and error detection force you to decide which time relationship matters before you choose a form.')}<div class="section"><div class="callout"><div class="tag">Spaced review</div><h3>${dueSkills().length} skill(s) due now.</h3><p>Review uses alternate surface forms rather than simply repeating the same main question.</p><button class="btn" id="reviewNow">Build my review</button><div id="reviewZone"></div></div></div><div class="section"><div class="section-head"><div><div class="eyebrow">Mistake museum</div><h2>Which reasoning traps keep returning?</h2></div><p>This list is local to your device. It records misconception tags, not personal information.</p></div><div class="card">${mistakes.length?mistakes.map(([k,n])=>`<div class="mistake-row"><span>${esc(k.replaceAll('-',' '))}</span><span class="badge">${n} miss${n===1?'':'es'}</span></div>`).join(''):'<p>No repeated misconception pattern yet. Complete some practice and return here.</p>'}</div></div><div class="section"><div class="section-head"><div><div class="eyebrow">Mixed exam practice</div><h2>No topic labels inside the questions.</h2></div><p>Some items are correct as written. Do not assume every sentence contains an error.</p></div>${activities.filter(a=>a.module==='lab').map(renderActivity).join('')}</div><div class="section editor"><div class="section-head"><div><div class="eyebrow">Transfer task</div><h2>Edit the whole paragraph, not one isolated verb.</h2></div><p>Use the timeline first. Then compare your revision with the checklist rather than a brittle exact-string answer. Revealing the checklist does not by itself increase mastery.</p></div><textarea id="editorText" aria-label="Edit the mixed-tense paragraph" spellcheck="false">Last month, the campus theatre has installed a new ticketing system. Since then, staff are testing it during every evening performance. By the time the festival begins next week, the team completes two full stress tests. The box office will open at 9:00 each morning, and the manager is believing the new system will reduce queues. When the doors will open on Friday, volunteers will be guiding visitors to the new kiosks.</textarea><div class="btnrow" style="margin-top:12px"><button class="btn" id="checkEditor">Show comparison checklist</button></div><div class="rubric" id="editorResult"><div class="callout"><div class="tag">Check your reasoning</div><ul><li><b>Last month</b> is a finished past time: the installation should be simple past.</li><li><b>Since then</b> reaches the present: the continuing testing should use a perfect link, preferably present perfect progressive.</li><li><b>By the time … next week</b> sets a future completion point: use future perfect for the two stress tests.</li><li><b>Opens at 9:00 each morning</b> is a fixed schedule, so simple present is appropriate.</li><li><b>Believe</b> is stative in the course list, so avoid the progressive form.</li><li>Inside the future time clause beginning with <b>when</b>, use present simple: “when the doors open”.</li><li>The main future action “volunteers will be guiding” can remain future progressive if the intended meaning is an activity underway during arrival.</li></ul></div></div></div><div class="section"><div class="section-head"><div><div class="eyebrow">Plain-English glossary</div><h2>Labels after meaning.</h2></div><p>Use these when you need the formal name, not as a substitute for understanding.</p></div><div id="glossary"></div></div>`;bindActivities(document.getElementById('labContent'));document.getElementById('reviewNow').onclick=buildReview;document.getElementById('checkEditor').onclick=()=>{document.getElementById('editorResult').classList.add('show');queueSave();updateChrome()};renderGlossary()}
const glossary={'reference point':'The time from which the sentence is viewing another action. It may be present, past, or future.','simple':'The plain viewpoint: fact, state, routine, or event without special emphasis on progress or a time link.','progressive / continuous':'An action viewed as in progress at the reference time.','perfect':'A viewpoint that links an earlier action or state to a later reference point.','past participle':'The verb form used after have/has/had and in passive constructions; for regular verbs it often ends in -ed, but many common verbs are irregular.','stative verb':'A verb that describes a state such as knowing, believing, owning or seeming rather than an activity unfolding moment by moment.','time clause':'A dependent clause introduced by words such as when, before or after. In future-time contexts, the course normally keeps this clause in the present rather than using will.'};
function renderGlossary(){const g=document.getElementById('glossary');if(!g)return;g.innerHTML=Object.entries(glossary).map(([k,v],i)=>`<div class="gloss-row"><button aria-expanded="false" aria-controls="gloss-${i}"><b>${esc(k)}</b><span>＋</span></button><div class="plain-def" id="gloss-${i}">${esc(v)}</div></div>`).join('');g.querySelectorAll('.gloss-row button').forEach(b=>b.onclick=()=>{const row=b.parentElement,open=!row.classList.contains('open');row.classList.toggle('open',open);b.setAttribute('aria-expanded',open?'true':'false')})}
function bindNote(id){const el=document.getElementById(id);if(!el)return;el.value=state.notes[id]||'';el.addEventListener('input',()=>{state.notes[id]=el.value;queueSave()})}
function renderAll(){renderHome();renderFoundations();renderPresent();renderPast();renderFuture();renderMemorise();renderErrors();renderLab();updateChrome()}
function routeTitle(id){return modules.find(m=>m.id===id)?.title||'Home'}function go(id,saveCurrent=true){if(!modules.some(m=>m.id===id))id='home';const current=document.querySelector('.page.active')?.dataset.page;if(saveCurrent&&current)state.scroll[current]=window.scrollY;if(id==='home')renderHome();if(id==='lab')renderLab();document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.dataset.page===id));document.getElementById('currentTitle').textContent=routeTitle(id);state.lastRoute=id;if(id!=='home')state.lastLearningRoute=id;location.hash=id;document.body.classList.remove('drawer-open');setTimeout(()=>window.scrollTo(0,state.scroll[id]||0),0);queueSave();updateChrome();updateBottom(id)}
function bindGo(root=document){root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function updateChrome(){const nav=document.getElementById('sideNav');nav.innerHTML=modules.map(m=>`<button data-route="${m.id}" aria-current="${state.lastRoute===m.id?'page':'false'}" class="${state.lastRoute===m.id?'active':''}"><span class="num">${m.n}</span><span class="copy"><b>${esc(m.title)}</b><span>${esc(m.sub)}</span></span><span class="done-dot ${moduleProgress(m.id)>=80?'on':''}"></span></button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.route));const pct=totalProgress();document.getElementById('overallPct').textContent=pct+'%';document.getElementById('overallBar').style.width=pct+'%'}
function updateBottom(id){document.querySelectorAll('.bottomnav button').forEach(b=>b.classList.remove('active'));const key=id==='home'?'home':id==='lab'?'lab':'continue';document.querySelector(`[data-bottom="${key}"]`)?.classList.add('active')}
function applyBrandLogo(){const img=document.querySelector('.brand-mark img');if(img)img.src=state.theme==='focus'?'/bth_compact_square_maroon.png':'/bth_compact_square.png';}
function initTheme(){document.documentElement.dataset.theme=state.theme==='focus'?'focus':'';applyBrandLogo();document.getElementById('themeBtn').onclick=()=>{state.theme=state.theme==='focus'?'light':'focus';document.documentElement.dataset.theme=state.theme==='focus'?'focus':'';applyBrandLogo();queueSave()}}
function initRailCollapse(){const KEY='bth-verbtenses-rail-collapsed';document.body.classList.toggle('rail-collapsed',localStorage.getItem(KEY)==='1');const toggle=()=>{const now=document.body.classList.toggle('rail-collapsed');try{localStorage.setItem(KEY,now?'1':'0');}catch(e){}};document.getElementById('railToggleBtn').onclick=toggle;document.getElementById('railReopenBtn').onclick=toggle;}
function initNav(){document.getElementById('menuBtn').onclick=()=>document.body.classList.add('drawer-open');document.getElementById('backdrop').onclick=()=>document.body.classList.remove('drawer-open');document.querySelector('[data-bottom="home"]').onclick=()=>go('home');document.querySelector('[data-bottom="lab"]').onclick=()=>go('lab');document.querySelector('[data-bottom="continue"]').onclick=()=>go(state.lastLearningRoute||'foundations');let t;window.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{state.scroll[state.lastRoute]=window.scrollY;queueSave()},180)},{passive:true});window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id&&id!==state.lastRoute)go(id)})}
function initBackup(){const d=document.getElementById('backupDialog');document.getElementById('backupBtn').onclick=()=>d.showModal();document.getElementById('closeBackup').onclick=()=>d.close();document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bth-verb-tenses-progress.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=migrateState(JSON.parse(r.result));saveState();location.reload()}catch(err){alert('Could not read that backup file.')}};r.readAsText(f)};document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset saved progress?')){localStorage.removeItem(COURSE_KEY);LEGACY_KEYS.forEach(k=>localStorage.removeItem(k));location.hash='home';location.reload()}}}
renderAll();bindGo();bindActivities();initTheme();initNav();initBackup();initRailCollapse();go(location.hash.slice(1)||state.lastRoute||'home',false);
</script>
</body></html>
