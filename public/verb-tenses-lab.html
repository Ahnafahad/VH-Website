const COURSE_KEY='bth-english-5.1-verb-tenses';const LEGACY_KEYS=['bth-english-5.1-verb-tenses:v1'];const COURSE_VERSION=2;
const modules=[{"id":"home","n":"00","title":"Home","sub":"resume & mastery"},{"id":"foundations","n":"01","title":"Tense Foundations","sub":"time + viewpoint"},{"id":"present","n":"02","title":"Present Family","sub":"four present forms"},{"id":"past","n":"03","title":"Past Family","sub":"sequence + duration"},{"id":"future","n":"04","title":"Future Family","sub":"plans + future points"},{"id":"memorise","n":"05","title":"What to Memorise","sub":"forms + stative verbs"},{"id":"errors","n":"06","title":"Common Errors","sub":"eight exam traps"},{"id":"lab","n":"07","title":"Exam Lab","sub":"mixed correction + review"}];const skillMeta={"tense-model":"Time + viewpoint","present-family":"Present tense family","past-family":"Past tense family","future-family":"Future tense family","stative":"Stative verbs","consistency":"Inconsistent tense usage","presperf-past":"Present perfect vs simple past","sequence":"Sequence of tenses","future-choice":"Future tense choice","pastperf-past":"Past perfect vs simple past","progressive-misuse":"Progressive misuse","presperfprog":"Present perfect progressive","scheduled-future":"Present vs future for future events","transfer":"Mixed sentence correction"};const tenseCards={"present":[{"name":"Simple Present","meaning":"Use it when the situation is treated as a fact, routine, regular action, or general truth rather than as an action unfolding at this moment.","formation":"base form; add -s/-es for third-person singular","example":"The archive opens at nine on weekdays.","cue":"routine / fact / timeless statement"},{"name":"Present Progressive","meaning":"Use it when the action is in progress now, temporary, or developing around the present period. With a future time expression, it can also describe a planned future arrangement.","formation":"am / is / are + -ing form","example":"The design team is testing a quieter cooling system this week.","cue":"now / temporary / changing situation"},{"name":"Present Perfect","meaning":"Use it when a past action still matters now, when experience is counted up to now, when a recent event or change matters now, or when a situation began earlier and still continues.","formation":"have / has + past participle","example":"The museum has restored three manuscripts this month.","cue":"past linked to now"},{"name":"Present Perfect Progressive","meaning":"Use it when an action began earlier, is still continuing, and the duration or continuing activity is the point.","formation":"have / has been + -ing form","example":"The engineers have been monitoring the bridge since dawn.","cue":"duration reaching the present"}],"past":[{"name":"Simple Past","meaning":"Use it when the action is treated as completed in the past: a single event, a repeated past action, or a long-term state that has ended. A stated or understood past time usually makes this the default.","formation":"past form; -ed for regular verbs","example":"The committee approved the revised budget on Tuesday.","cue":"completed past event"},{"name":"Past Progressive","meaning":"Use it for an action that was already in progress at a particular past time, often as background for a shorter event or alongside another simultaneous past activity.","formation":"was / were + -ing form","example":"At midnight, technicians were recalibrating the sensors.","cue":"in progress at a past point"},{"name":"Past Perfect","meaning":"Use it to mark the earlier of two past actions when the order needs to be made clear. The later past action normally stays simple past.","formation":"had + past participle","example":"The courier had left before the receptionist found the parcel note.","cue":"earlier than another past event"},{"name":"Past Perfect Progressive","meaning":"Use it for an activity that had been continuing for a period before another past point or event.","formation":"had been + -ing form","example":"The orchestra had been rehearsing for two hours when the power failed.","cue":"duration up to a past point"}],"future":[{"name":"Simple Future","meaning":"Use will for straightforward future statements and general predictions. Use be going to when a plan is already formed or present evidence makes the outcome look imminent.","formation":"will + base form; or be going to + base form","example":"The council will publish the decision after the vote.","cue":"prediction / intention / future statement"},{"name":"Future Progressive","meaning":"Use it for an action that will be in progress at a particular future time, including two parallel future activities viewed as unfolding together.","formation":"will be + -ing form","example":"At noon tomorrow, the field team will be collecting water samples.","cue":"in progress at a future point"},{"name":"Future Perfect","meaning":"Use it when the action will already be complete by a stated future deadline or reference point.","formation":"will have + past participle","example":"By Friday, the lab will have processed every sample.","cue":"completed by a future point"},{"name":"Future Perfect Progressive","meaning":"Use it when an activity will have continued for a duration up to a future reference point.","formation":"will have been + -ing form","example":"By October, the researchers will have been tracking the colony for eighteen months.","cue":"duration up to a future point"}]};const stativeVerbs=["know","believe","want","need","like","love","hate","understand","remember","belong","seem","own","doubt","realize"];const activities=[{"id":"f01","module":"foundations","skill":"tense-model","kind":"Meaning check","prompt":"A camera records one frame every evening at 7. Which description treats the action as a repeated fact rather than as something unfolding at one moment?","options":["The camera records one frame every evening.","The camera is recording one frame at 7 right now.","The camera has recorded one frame already.","The camera has been recording for an hour."],"answer":0,"hint1":"Ignore the tense names. Ask which option presents a repeated pattern as a plain fact.","hint2":"A routine does not need a “video in progress” viewpoint.","explain":"“Records one frame every evening” presents the action as a regular fact. That is the meaning carried by the simple viewpoint.","deeper":"Progressive adds an in-progress viewpoint; perfect links an earlier action to a reference point; perfect progressive adds both continuation and that link.","mis":["","confuses-routine-with-now","confuses-simple-with-perfect","confuses-simple-with-duration"]},{"id":"f02","module":"foundations","skill":"tense-model","kind":"Minimal contrast","prompt":"What is the main difference between “The crew inspected the roof” and “The crew was inspecting the roof”?","options":["The first is future and the second is present.","The second must mean the inspection was never finished.","The first makes the inspection sound completed as an event; the second shows it in progress at a past time.","There is no difference in viewpoint."],"answer":2,"hint1":"Both are past. Focus on how the action is being viewed.","hint2":"One is a completed event; the other is a scene already in progress.","explain":"Simple past presents the inspection as an event. Past progressive opens the action up and shows it unfolding.","deeper":"Progressive does not automatically mean unfinished forever; it only shows the action as in progress at the reference time.","mis":["misreads-time-family","progressive-means-never-finished","","ignores-aspect"]},{"id":"f03","module":"foundations","skill":"tense-model","kind":"Bridge check","prompt":"Which sentence most clearly links an earlier event to the present rather than locating it at a finished past time?","options":["The studio has replaced its lights, so the stage is brighter now.","The studio replaced its lights last Saturday.","The studio was replacing its lights at noon.","The studio will replace its lights next Saturday."],"answer":0,"hint1":"Look for a sentence whose earlier action matters to the situation now.","hint2":"A finished date points to simple past; a present result points to a perfect link.","explain":"“Has replaced” connects the earlier change with the present result. That link is the central idea of the present perfect here.","deeper":"The perfect viewpoint is not merely “a fancy past”. It tells the reader why the earlier action belongs in the current frame.","mis":["","specific-past","confuses-perfect-with-progressive","wrong-time-family"]},{"id":"f04","module":"foundations","skill":"tense-model","kind":"Duration check","prompt":"Which option makes both continuation and duration central to the message?","options":["The volunteers have been sorting donations for three hours.","The volunteers sort donations every Friday.","The volunteers are sorting donations now.","The volunteers have sorted the donations."],"answer":0,"hint1":"Find the option that answers “how long?” while also keeping the action in progress.","hint2":"You need both been + -ing and a duration reaching the present.","explain":"“Have been sorting … for three hours” combines the perfect link with the progressive viewpoint and explicitly stresses duration.","deeper":"Perfect progressive is useful when the stretch of activity matters, not merely the fact that some work has been completed.","mis":["","routine-not-duration","present-progressive-only","completion-not-duration"]},{"id":"pr01","module":"present","skill":"present-family","kind":"Use check","prompt":"A scientific manual states a property that remains generally true. Which verb choice fits that purpose best?","options":["The alloy is resisting corrosion at room temperature.","The alloy has resisted corrosion at room temperature.","The alloy has been resisting corrosion at room temperature.","The alloy resists corrosion at room temperature."],"answer":3,"hint1":"A general property is not a temporary action around now.","hint2":"Facts and accepted properties normally stay in the simple present.","explain":"“Resists” presents the property as a general truth.","deeper":"Progressive forms make the statement sound temporary or currently observed; perfect forms add an unnecessary time link.","mis":["temporary-reading","past-link","duration-reading",""]},{"id":"pr02","module":"present","skill":"present-family","kind":"Temporary or routine?","prompt":"Which sentence most naturally describes a temporary arrangement rather than a normal routine?","options":["Mina is working from the north office while her desk is repaired.","Mina works from the north office every Monday.","Mina has worked from the north office for six years.","Mina has been working from the north office since 2020."],"answer":0,"hint1":"Look for a situation that is true around now but is not presented as permanent.","hint2":"A temporary current arrangement usually takes am/is/are + -ing.","explain":"“Is working” fits a temporary arrangement around the present.","deeper":"The simple present sounds habitual; the two perfect forms imply a longer connection reaching the present.","mis":["","habit","long-state","duration-long-state"]},{"id":"pr03","module":"present","skill":"presperf-past","kind":"Present perfect boundary","prompt":"Which sentence is best for a completed action tied to a specific finished past time?","options":["I renewed the licence yesterday.","I have renewed the licence yesterday.","I have been renewing the licence yesterday.","I renew the licence yesterday."],"answer":0,"hint1":"A named finished past time is the strongest clue here.","hint2":"“Yesterday” closes the time period; choose the plain past event form.","explain":"Simple past fits a completed action at a specified past time.","deeper":"In the course convention, a present perfect verb with a clearly finished past-time marker is normally the error.","mis":["","present-perfect-with-finished-time","progressive-with-finished-time","present-with-past-marker"]},{"id":"pr04","module":"present","skill":"presperfprog","kind":"Ongoing duration","prompt":"The repair began before now, is still continuing, and the writer wants to stress the length of the work. Which version fits best?","options":["The technicians repair the lift for four hours.","The technicians are repairing the lift for four hours.","The technicians have been repairing the lift for four hours.","The technicians have repaired the lift for four hours."],"answer":2,"hint1":"The action began earlier and is still running.","hint2":"Use the form that combines have/has been with -ing.","explain":"Present perfect progressive fits an action continuing from the past into the present with duration stressed.","deeper":"Present perfect can sometimes describe continuation, but the progressive form makes the ongoing activity and its duration more prominent.","mis":["simple-with-duration","present-progressive-no-past-link","","completion-reading"]},{"id":"pa01","module":"past","skill":"past-family","kind":"Background action","prompt":"At 2 a.m., one activity was already underway when an alarm sounded. Which sentence shows that relationship most clearly?","options":["The guards checked the loading bay when the alarm sounded.","The guards had checked the loading bay when the alarm sounded.","The guards have checked the loading bay when the alarm sounded.","The guards were checking the loading bay when the alarm sounded."],"answer":3,"hint1":"One action should look like background in progress; the alarm is the shorter event.","hint2":"The background action needs was/were + -ing.","explain":"Past progressive shows the inspection already in progress when the alarm occurred.","deeper":"Past perfect would mean the checking was completed before the alarm, which changes the sequence.","mis":["both-simple","completed-before","present-perfect-in-past",""]},{"id":"pa02","module":"past","skill":"pastperf-past","kind":"Earlier past event","prompt":"Two events are both past. Which sentence explicitly marks the earlier review with past perfect while keeping the later sending in simple past?","options":["The analyst sent the memo after she reviewed the figures.","The analyst sent the memo after she had reviewed the figures.","The analyst had sent the memo after she reviewed the figures.","The analyst has sent the memo after she had reviewed the figures."],"answer":1,"hint1":"Ask which action happened first: reviewing or sending.","hint2":"Only the earlier past action needs the perfect marker.","explain":"The review happened first, so “had reviewed” marks the earlier action; “sent” stays simple past.","deeper":"Past perfect is not a decoration for every past verb. It is used to establish an earlier past point when the sequence needs marking.","mis":["under-marks-earlier","","marks-later-as-earlier","mixes-present-perfect"]},{"id":"pa03","module":"past","skill":"pastperf-past","kind":"Do not overuse past perfect","prompt":"The sentence simply lists two completed events in chronological order. Which version is best?","options":["In 2018, the clinic had opened a second branch and hired twelve nurses the following month.","In 2018, the clinic opened a second branch and hired twelve nurses the following month.","In 2018, the clinic was opening a second branch and had hired twelve nurses the following month.","In 2018, the clinic has opened a second branch and hired twelve nurses the following month."],"answer":1,"hint1":"No later past reference point needs to be looked back from.","hint2":"Ordinary chronological narration usually stays in simple past.","explain":"Simple past is enough because the events are already told in order.","deeper":"Using past perfect without a meaningful earlier-versus-later relationship can make the sequence sound unnecessarily marked or wrong.","mis":["overuses-past-perfect","","mixed-aspect","present-perfect-with-finished-time"]},{"id":"pa04","module":"past","skill":"past-family","kind":"Duration before a past point","prompt":"Which sentence stresses that an activity continued for a period before a later past event?","options":["The survey team had been working for six hours when the generator failed.","The survey team worked for six hours when the generator failed.","The survey team was working for six hours when the generator failed.","The survey team had worked for six hours when the generator failed."],"answer":0,"hint1":"The key meaning is a stretch of activity leading up to another past event.","hint2":"Look for had been + -ing.","explain":"Past perfect progressive makes the duration before the generator failure the centre of the message.","deeper":"Past perfect can emphasise completed work; past perfect progressive is stronger when the ongoing stretch itself matters.","mis":["","simple-duration-awkward","progressive-no-earlier-link","completion-not-process"]},{"id":"fu01","module":"future","skill":"future-choice","kind":"Prediction or present evidence?","prompt":"A technician sees smoke coming from a machine. Which future expression best matches a prediction based on present evidence?","options":["The machine will fail because the service log says failures are common.","The machine fails next hour.","The machine is going to fail; smoke is already coming from the casing.","The machine will have failed next hour."],"answer":2,"hint1":"The clue is evidence visible now, not a general guess.","hint2":"The course distinguishes general will from be going to when present evidence makes the outcome look imminent.","explain":"“Is going to fail” matches a prediction grounded in present evidence.","deeper":"The distinction is about the kind of future meaning, not simply about which form sounds more formal.","mis":["general-prediction","simple-present-prediction","","future-perfect-no-deadline"]},{"id":"fu02","module":"future","skill":"future-family","kind":"Future in progress","prompt":"Which sentence places an action in progress at a specific future time?","options":["At 4 tomorrow, the auditors review the final ledger.","At 4 tomorrow, the auditors will review the final ledger.","At 4 tomorrow, the auditors will have reviewed the final ledger.","At 4 tomorrow, the auditors will be reviewing the final ledger."],"answer":3,"hint1":"The action should be open and unfolding at 4, not merely scheduled or completed.","hint2":"Use will be + -ing for an action in progress at that future point.","explain":"Future progressive shows the review as ongoing at 4 tomorrow.","deeper":"Simple future states the event; future perfect would place the review before the reference point.","mis":["scheduled-present-mismatch","simple-future-event","future-perfect-completed",""]},{"id":"fu03","module":"future","skill":"future-choice","kind":"Future deadline","prompt":"A deadline is the key meaning: the task must already be complete before noon Friday. Which version fits best?","options":["By noon Friday, the team completes the migration.","By noon Friday, the team will have completed the migration.","By noon Friday, the team will complete the migration.","By noon Friday, the team will be completing the migration."],"answer":1,"hint1":"The phrase “by noon Friday” gives a future completion point.","hint2":"Choose the form that looks back from that future point to a completed action.","explain":"Future perfect is the natural form when completion before a future deadline is central.","deeper":"Plain will can state a future event, but it does not mark the “already complete by then” relationship as clearly.","mis":["simple-present-not-schedule","","simple-future-not-completion-link","future-progressive-in-progress"]},{"id":"fu04","module":"future","skill":"sequence","kind":"Future time clause","prompt":"Which sentence follows the course convention for a future event inside a time clause?","options":["When the gates will close tonight, the security team will lock the outer road.","When the gates closed tonight, the security team will lock the outer road.","When the gates have been closing tonight, the security team will lock the outer road.","When the gates close tonight, the security team will lock the outer road."],"answer":3,"hint1":"The dependent clause begins with “when”.","hint2":"Future time clauses normally use the present form even though the meaning is future.","explain":"“When the gates close” is the expected time-clause form; the main clause can still use will.","deeper":"The present form here does not make the event present in time. It is the grammatical convention used inside the future time clause.","mis":["will-in-time-clause","past-in-future-clause","progressive-perfect-mismatch",""]},{"id":"fu05","module":"future","skill":"scheduled-future","kind":"Schedule or prediction?","prompt":"Which pair correctly uses the present for a fixed timetable and the future for a prediction?","options":["The shuttle will leave at 6:15 tomorrow, and the roads are crowded at that hour.","The shuttle leaves at 6:15 tomorrow, and the roads will probably be crowded at that hour.","The shuttle is leaving at 6:15 tomorrow, and the roads crowd at that hour.","The shuttle has left at 6:15 tomorrow, and the roads will be crowded at that hour."],"answer":1,"hint1":"Separate the two meanings: timetable first, prediction second.","hint2":"A fixed schedule can stay in present simple; a forecast about conditions needs future meaning.","explain":"“The shuttle leaves … and the roads will probably be crowded” keeps the timetable in simple present and uses will for the predicted traffic conditions.","deeper":"Do not force every future-looking verb into a future form. The sentence may contain different future relationships.","mis":["overuses-will-for-schedule","","prediction-in-simple-present","present-perfect-future"]},{"id":"m01","module":"memorise","skill":"stative","kind":"Stative verb check","prompt":"In formal written English, which sentence uses the course convention for a stative verb?","options":["The curator is knowing where the key is kept.","The curator has been knowing where the key is kept.","The curator knows where the key is kept.","The curator will be knowing where the key is kept."],"answer":2,"hint1":"Ask whether the verb describes a state of knowledge or an action that unfolds.","hint2":"The stative verb “know” normally stays out of progressive forms in formal writing.","explain":"“Knows” follows the course convention: a state of knowledge is expressed with the simple form.","deeper":"Informal or promotional English sometimes stretches this rule for certain verbs, but the lecture asks you to treat progressive stative forms as errors in formal writing.","mis":["stative-progressive","stative-perfect-progressive","","stative-future-progressive"]},{"id":"m02","module":"memorise","skill":"tense-model","kind":"Formation check","prompt":"Which formation belongs to the future perfect progressive?","options":["will + base form","will be + -ing form","will have + past participle","will have been + -ing form"],"answer":3,"hint1":"Build the label from its parts: future + perfect + progressive.","hint2":"Future gives will; perfect adds have; progressive adds been + -ing.","explain":"The complete structure is will have been + -ing form.","deeper":"Learning the four viewpoint patterns makes the twelve forms easier than memorising twelve unrelated strings.","mis":["future-simple-form","future-progressive-form","future-perfect-form",""]},{"id":"m03","module":"memorise","skill":"tense-model","kind":"Pattern builder","prompt":"Which statement is the most useful way to organise the twelve tenses?","options":["Start with present/past/future, then combine each time family with simple, progressive, perfect, or perfect progressive.","Memorise twelve separate names with no connection.","Treat every verb phrase containing “have” as present perfect.","Use cue words alone and ignore meaning."],"answer":0,"hint1":"The lecture presents four recurring ideas across three time families.","hint2":"Look for the option that reduces twelve forms to a 3 × 4 system.","explain":"Three time families multiplied by four viewpoints generate the twelve tense forms.","deeper":"Cue words can help, but they should confirm a time relationship rather than replace it.","mis":["","rote-without-structure","have-equals-present-perfect","cue-word-only"]},{"id":"m04","module":"memorise","skill":"past-family","kind":"Irregular-form checkpoint","prompt":"Which pair correctly completes the sentence: “Yesterday the editor ___ the summary; by noon she had ___ the appendix as well”?","options":["written / wrote","wrote / written","writed / written","wrote / wrote"],"answer":1,"hint1":"The first blank needs the simple-past form; the second follows had and needs a past participle.","hint2":"For write, the forms are write → wrote → written.","explain":"“Wrote / written” correctly uses the irregular simple past first and the past participle after had.","deeper":"Irregular verbs are worth learning as form families because simple past and past participle are not always identical.","mis":["swaps-past-and-participle","","regularises-irregular-verb","uses-past-after-had"]},{"id":"e01","module":"errors","skill":"consistency","kind":"Error 1 · Tense consistency","prompt":"Choose the revision that keeps both completed actions inside the same finished past situation.","options":["The gallery opened at ten yesterday and welcomes its first visitors fifteen minutes later.","The gallery opens at ten yesterday and welcomed its first visitors fifteen minutes later.","The gallery opened at ten yesterday and welcomed its first visitors fifteen minutes later.","The gallery has opened at ten yesterday and welcomed its first visitors fifteen minutes later."],"answer":2,"hint1":"“Yesterday” fixes the context in the past.","hint2":"Both verbs describe events inside that same completed past frame.","explain":"Both actions belong to the finished past context, so simple past is consistent.","deeper":"A tense shift can be correct when the time relationship changes. The problem is an unexplained shift that contradicts the actual timeline.","mis":["present-shift","mixed-first-verb","","present-perfect-with-finished-time"]},{"id":"e02","module":"errors","skill":"presperf-past","kind":"Error 2 · Present perfect vs simple past","prompt":"Which sentence correctly matches a completed action with a specific finished past time?","options":["We met the supplier last Thursday.","We have met the supplier last Thursday.","We are meeting the supplier last Thursday.","We have been meeting the supplier last Thursday."],"answer":0,"hint1":"A specific finished past time usually closes the event.","hint2":"“Last Thursday” strongly points to simple past.","explain":"Simple past fits the completed event at a stated past time.","deeper":"Since, for, already, yet, ever and never often appear with present perfect, but a specific finished time usually rules it out in this exam convention.","mis":["","present-perfect-specific-time","present-progressive-past","perfect-progressive-specific-time"]},{"id":"e03","module":"errors","skill":"sequence","kind":"Error 3 · Sequence of tenses","prompt":"Which sentence marks an earlier past action without unnecessarily putting both actions in past perfect?","options":["After the installer had tested the system, the client had signed the acceptance form.","After the installer tested the system, the client had signed the acceptance form.","After the installer had tested the system, the client signed the acceptance form.","After the installer has tested the system, the client signed the acceptance form."],"answer":2,"hint1":"Testing happened first; signing happened later.","hint2":"Use had + participle only for the earlier action when the sequence needs marking.","explain":"The test is earlier and takes past perfect; the later signing stays simple past.","deeper":"Using past perfect for both actions destroys the contrast that the form is supposed to create.","mis":["past-perfect-both","marks-later-as-earlier","","present-perfect-in-past-sequence"]},{"id":"e04","module":"errors","skill":"future-choice","kind":"Error 4 · Future tenses","prompt":"Which sentence correctly shows completion before a future deadline?","options":["By the end of the shift, the mechanics will inspect all twelve vehicles.","By the end of the shift, the mechanics will have inspected all twelve vehicles.","By the end of the shift, the mechanics are inspecting all twelve vehicles.","By the end of the shift, the mechanics inspected all twelve vehicles."],"answer":1,"hint1":"“By the end of the shift” asks whether the inspection is already complete then.","hint2":"Future perfect is built for a future deadline viewed from that later point.","explain":"“Will have inspected” shows that the inspections will be complete by the deadline.","deeper":"A future deadline often needs more than plain will because the sentence is not merely saying the action will happen; it is locating completion before a future point.","mis":["simple-future-not-completion-link","","present-progressive-future","past-in-future"]},{"id":"e05","module":"errors","skill":"pastperf-past","kind":"Error 5 · Past perfect vs simple past","prompt":"Which sentence uses past perfect only where it adds a real earlier-past relationship?","options":["The researcher had joined the institute in 2019 and had published her first report in 2020.","The researcher had joined the institute in 2019 and published her first report in 2020, although no later past reference point is given.","The researcher has joined the institute in 2019 and published her first report in 2020.","The researcher joined the institute in 2019 and published her first report in 2020."],"answer":3,"hint1":"The dates already put the events in order.","hint2":"Past perfect is unnecessary when ordinary chronology already does the work.","explain":"Simple past is the clean choice for two dated past events told in order.","deeper":"Past perfect should not be used merely because one past event happened before another in calendar time; the sentence needs a meaningful past reference point or sequence contrast.","mis":["overuses-past-perfect","unnecessary-past-perfect","present-perfect-specific-time",""]},{"id":"e06","module":"errors","skill":"progressive-misuse","kind":"Error 6 · Progressive tenses","prompt":"Which version follows the lecture’s formal-writing rule for the stative verb “own”?","options":["The cooperative owns three delivery vans this year.","The cooperative is owning three delivery vans this year.","The cooperative has been owning three delivery vans this year.","The cooperative will be owning three delivery vans this year."],"answer":0,"hint1":"“Own” describes a state, not an activity unfolding moment by moment.","hint2":"In formal written English, keep this stative verb out of progressive forms.","explain":"“Owns” is the expected formal form for this state.","deeper":"Some stative verbs can be used progressively when their meaning changes, but the lecture’s exam rule is to treat the listed stative verbs in progressive form as suspicious.","mis":["","stative-progressive","stative-perfect-progressive","stative-future-progressive"]},{"id":"e07","module":"errors","skill":"presperfprog","kind":"Error 7 · Present perfect progressive","prompt":"The activity began before now and is still continuing. Which revision best stresses that ongoing duration?","options":["The analysts review the pricing model since January.","The analysts are reviewing the pricing model since January.","The analysts have been reviewing the pricing model since January.","The analysts have reviewed the pricing model since January."],"answer":2,"hint1":"“Since January” gives a starting point that reaches the present.","hint2":"Use have/has been + -ing when the ongoing stretch of work is the emphasis.","explain":"Present perfect progressive makes the continuing work and its duration explicit.","deeper":"Present perfect can sometimes describe a continuing situation, especially with stative verbs, but an active process with duration is a strong fit for the progressive form.","mis":["simple-with-since","present-progressive-no-past-link","","completion-reading"]},{"id":"e08","module":"errors","skill":"scheduled-future","kind":"Error 8 · Present vs future for future events","prompt":"Which sentence correctly separates a fixed timetable from a prediction about the same future day?","options":["The exhibition will open at 10 tomorrow, and I am sure the entrance is busy by noon.","The exhibition opens at 10 tomorrow, and I am sure the entrance will be busy by noon.","The exhibition opened at 10 tomorrow, and I am sure the entrance will be busy by noon.","The exhibition has opened at 10 tomorrow, and I am sure the entrance is busy by noon."],"answer":1,"hint1":"One clause is a fixed schedule; the other is a prediction.","hint2":"The timetable can use present simple, while the prediction needs future meaning.","explain":"“Opens” is standard for the fixed schedule, while “will be” expresses the predicted future condition.","deeper":"A future-looking sentence can legitimately mix present and future forms when the meanings are different.","mis":["will-for-schedule-plus-present-prediction","","past-with-future-time","present-perfect-future"]},{"id":"e09","module":"errors","skill":"sequence","kind":"Mixed trap","prompt":"Which sentence correctly avoids will inside a future conditional clause?","options":["If the backup will fail tonight, the server will switch to the secondary unit.","If the backup fails tonight, the server switches to the secondary unit.","If the backup failed tonight, the server will switch to the secondary unit.","If the backup fails tonight, the server will switch to the secondary unit."],"answer":3,"hint1":"The condition itself should not normally take will.","hint2":"Keep the if-clause in present simple and put will in the main result clause.","explain":"“If the backup fails … the server will switch” follows the expected future conditional pattern.","deeper":"The same principle appears in future time clauses: future meaning does not always require a future-form verb inside the dependent clause.","mis":["will-in-condition","present-main-result","past-condition-mismatch",""]},{"id":"e10","module":"errors","skill":"consistency","kind":"Mixed timeline","prompt":"A report describes a completed investigation but then states a general principle that remains true. Which tense pattern is logical?","options":["The team analysed the sample and concluded that copper conducted electricity well.","The team analysed the sample and concluded that copper conducts electricity well.","The team has analysed the sample and concludes that copper conducted electricity well.","The team was analysing the sample and will conclude that copper conducts electricity well."],"answer":1,"hint1":"Not every verb must match if the meaning belongs to a different time frame.","hint2":"The investigation is past, but the scientific statement remains generally true.","explain":"The past reporting verbs can sit beside a simple-present general truth. Consistency means logical time relationships, not mechanical matching.","deeper":"This is why “keep every verb in the same tense” is a bad rule. General truths and habits can remain in simple present inside a past context.","mis":["mechanically-shifts-general-truth","","mixed-illogical","future-shift"]},{"id":"x01","module":"lab","skill":"transfer","kind":"Sentence correction","prompt":"The audit team has finished the warehouse inspection yesterday and is filing the report today. Choose the best revision.","options":["has finished the warehouse inspection yesterday and is filing","finished the warehouse inspection yesterday and is filing","had finished the warehouse inspection yesterday and filed","was finishing the warehouse inspection yesterday and files","has been finishing the warehouse inspection yesterday and is filing"],"answer":1,"hint1":"The underlined idea contains a named finished past time.","hint2":"Fix the verb tied to “yesterday” without changing the genuinely present action “is filing”.","explain":"“Finished … yesterday” correctly uses simple past, while “is filing … today” can remain present progressive.","deeper":"A good sentence-correction choice changes only what the timeline requires. It does not flatten every verb into the same tense.","mis":["present-perfect-specific-time","","unneeded-past-perfect-plus-time-shift","mixed-progressive-present","perfect-progressive-specific-time"]},{"id":"x02","module":"lab","skill":"transfer","kind":"Sentence correction","prompt":"By the time the keynote begins, the technicians complete the sound check. Choose the best revision.","options":["the technicians complete the sound check","the technicians completed the sound check","the technicians will complete the sound check","the technicians will have completed the sound check","the technicians are completing the sound check"],"answer":3,"hint1":"The phrase “by the time” creates a future reference point.","hint2":"The sound check should already be complete before the keynote begins.","explain":"Future perfect marks completion before the future reference point: “will have completed”.","deeper":"Notice that “begins” remains present in the future time clause. The future relationship belongs in the main clause.","mis":["present-not-schedule","past-mismatch","simple-future-not-completion-link","","progressive-not-complete"]},{"id":"x03","module":"lab","skill":"stative","kind":"Sentence correction","prompt":"The theatre is owning the building since 2016, so it controls all maintenance decisions. Choose the best revision.","options":["is owning the building since 2016","owns the building since 2016","has owned the building since 2016","has been owning the building since 2016","owned the building since 2016"],"answer":2,"hint1":"Two ideas matter: “own” is stative, and “since 2016” reaches the present.","hint2":"Use a non-progressive perfect form for a state that began in the past and still holds.","explain":"“Has owned” respects both the stative-verb convention and the continuing time span.","deeper":"This is a useful exception to the instinct that every “since” sentence should be perfect progressive. Stative verbs often prefer present perfect instead.","mis":["stative-progressive","simple-present-with-since","","stative-perfect-progressive","simple-past-breaks-continuation"]},{"id":"x04","module":"lab","skill":"future-family","kind":"Sentence correction","prompt":"At 8 tomorrow morning, the review panel examines applications for the scholarship. Choose the best revision for an action that will be underway at that time.","options":["examines applications","will examine applications","will be examining applications","will have examined applications","has examined applications"],"answer":2,"hint1":"The question tells you the action is underway at 8.","hint2":"Choose future progressive, not merely a future event.","explain":"“Will be examining” places the activity in progress at that future point.","deeper":"Future perfect would mean the reviewing was already complete by 8, which is the opposite viewpoint.","mis":["present-schedule-not-ongoing","simple-future-event","","future-perfect-completed","present-perfect"]},{"id":"x05","module":"lab","skill":"sequence","kind":"Sentence correction","prompt":"Before the permit will expire next month, the legal team will submit the renewal. Choose the best revision.","options":["Before the permit will expire next month","Before the permit expires next month","Before the permit expired next month","Before the permit has been expiring next month","Before the permit had expired next month"],"answer":1,"hint1":"The clause begins with “before” and refers to future time.","hint2":"Future time clauses normally use present simple.","explain":"“Before the permit expires next month” is the expected form; the main clause can still use will.","deeper":"Do not judge tense by calendar time alone. Clause type matters.","mis":["will-in-time-clause","","past-with-future-time","progressive-perfect-mismatch","past-perfect-future"]},{"id":"x06","module":"lab","skill":"transfer","kind":"Error detection","prompt":"(A) The ferry leaves at 6:30 tomorrow, (B) so passengers should arrive early, (C) because security will be screening bags (D) throughout boarding. (E) No error","options":["A","B","C","D","E — No error"],"answer":4,"hint1":"Check each verb against its job rather than assuming a future-looking sentence must contain an error.","hint2":"The departure is a fixed timetable; the screening is an action expected to be in progress during boarding.","explain":"There is no tense error. The present schedule and future progressive action can coexist logically.","deeper":"Including correct sentences prevents the learner from assuming that every exam item must be repaired.","mis":["false-positive-schedule","false-positive-modal","false-positive-future-progressive","false-positive-time-span",""]},{"id":"x07","module":"lab","skill":"presperfprog","kind":"Error detection","prompt":"(A) Since January, the clinic (B) is offering evening appointments (C) to reduce waiting times (D) for working patients. (E) No error","options":["A","B","C","D","E — No error"],"answer":1,"hint1":"“Since January” starts before now and reaches the present.","hint2":"The active process should carry a perfect link to the present.","explain":"Section B is the error. “Has been offering” is the strongest correction when the ongoing activity is emphasised.","deeper":"Simple present would turn the arrangement into a routine without expressing its start in January; present progressive alone does not reach back to that start.","mis":["marker-not-error","","purpose-clause-not-error","object-not-error","misses-error"]},{"id":"x08","module":"lab","skill":"pastperf-past","kind":"Error detection","prompt":"(A) By the time the storm reached the coast, (B) emergency crews evacuated (C) the lowest-lying neighbourhoods (D) several hours earlier. (E) No error","options":["A","B","C","D","E — No error"],"answer":1,"hint1":"The phrase “several hours earlier” makes one past action clearly earlier than another.","hint2":"The evacuation should be marked as complete before the storm reached the coast.","explain":"Section B is the error: “had evacuated” establishes the earlier past action.","deeper":"The time phrase makes the sequence meaningful enough to justify past perfect.","mis":["time-clause-not-error","","object-not-error","adverbial-not-error","misses-earlier-past"]},{"id":"x09","module":"lab","skill":"sequence","kind":"Error detection","prompt":"(A) If the temperature will fall below zero tonight, (B) the maintenance team will drain (C) the outdoor pipes (D) before midnight. (E) No error","options":["A","B","C","D","E — No error"],"answer":0,"hint1":"The future condition is inside an if-clause.","hint2":"The dependent conditional clause normally takes present simple, not will.","explain":"Section A is the error. The expected form is “If the temperature falls below zero tonight”.","deeper":"The main clause can keep “will drain” because it states the future result.","mis":["","main-future-is-correct","object-not-error","time-phrase-not-error","misses-will-in-condition"]},{"id":"x10","module":"lab","skill":"transfer","kind":"Error detection","prompt":"(A) The archive has preserved (B) these records for decades, (C) and researchers still consult them (D) whenever they study the region. (E) No error","options":["A","B","C","D","E — No error"],"answer":4,"hint1":"Look for a genuine clash, not merely different tense forms.","hint2":"The preservation began earlier and still matters; the consultation is a present routine.","explain":"There is no error. Present perfect and simple present express two different but compatible time relationships.","deeper":"Mixed tenses are often correct when the meanings justify them. The exam tests time logic, not visual uniformity.","mis":["false-positive-present-perfect","false-positive-duration","false-positive-present-simple","false-positive-time-clause",""]}];const reviewItems=[{"id":"rv01","module":"review","skill":"tense-model","kind":"Retrieval revisit","prompt":"Which form shows an action in progress at a reference time?","options":["Simple","Progressive","Perfect","Perfect progressive"],"answer":1,"hint1":"Think “video rather than still frame”.","hint2":"Which viewpoint opens the action up and shows it unfolding?","explain":"Progressive is the in-progress viewpoint.","deeper":"The time family tells you when; the viewpoint tells you how the action is framed.","mis":["","","",""]},{"id":"rv02","module":"review","skill":"present-family","kind":"Retrieval revisit","prompt":"Which sentence is a present routine?","options":["The lab is closing early today.","The lab has closed for repairs.","The lab has been closing early all week.","The lab closes at five every weekday."],"answer":3,"hint1":"Look for repetition, not a one-off current change.","hint2":"“Every weekday” signals a regular pattern.","explain":"Simple present fits the routine.","deeper":"A time marker helps only because it supports the meaning; it is not a magic password.","mis":["","","",""]},{"id":"rv03","module":"review","skill":"past-family","kind":"Retrieval revisit","prompt":"Which sentence sets an action as background in progress when another past event occurs?","options":["The lights failed while the crew tested the rig.","The lights had failed while the crew tested the rig.","The lights failed while the crew was testing the rig.","The lights have failed while the crew tested the rig."],"answer":2,"hint1":"The crew action should already be underway.","hint2":"Use was/were + -ing for past background.","explain":"Past progressive gives the background action.","deeper":"The shorter event can remain simple past.","mis":["","","",""]},{"id":"rv04","module":"review","skill":"future-family","kind":"Retrieval revisit","prompt":"Which form best means “already complete by 3 p.m. tomorrow”?","options":["will finish","will be finishing","will have finished","finishes"],"answer":2,"hint1":"The key is completion before a future point.","hint2":"Look for will have + participle.","explain":"Future perfect is the completion-by-a-future-point form.","deeper":"Future progressive would still show the action in progress.","mis":["","","",""]},{"id":"rv05","module":"review","skill":"stative","kind":"Retrieval revisit","prompt":"Which sentence follows the formal stative-verb convention?","options":["She believes the estimate.","She is believing the estimate.","She has been believing the estimate.","She will be believing the estimate."],"answer":0,"hint1":"“Believe” is a state in the course list.","hint2":"Avoid progressive forms here.","explain":"“Believes” is the formal choice.","deeper":"The app follows the supplied course convention even though real-world informal English can be more flexible.","mis":["","","",""]},{"id":"rv06","module":"review","skill":"consistency","kind":"Retrieval revisit","prompt":"Which sentence contains an unexplained tense clash?","options":["The report arrived yesterday and was logged immediately.","The report arrived yesterday and is being discussed today.","The report has arrived, so the team can act now.","The report arrives yesterday and was logged immediately."],"answer":3,"hint1":"Different tenses can be logical if the time really changes.","hint2":"Find the verb that contradicts “yesterday”.","explain":"“Arrives yesterday” is the clash.","deeper":"Consistency means a coherent timeline, not identical tense labels.","mis":["","","",""]},{"id":"rv07","module":"review","skill":"presperf-past","kind":"Retrieval revisit","prompt":"Choose the best form with “last Friday”.","options":["has signed","signed","has been signing","signs"],"answer":1,"hint1":"The time is a finished past point.","hint2":"Use simple past.","explain":"“Signed” fits a completed event last Friday.","deeper":"Present perfect normally stays away from specific finished past times in this course.","mis":["","","",""]},{"id":"rv08","module":"review","skill":"sequence","kind":"Retrieval revisit","prompt":"Complete the future time clause: “After the session ___, we will send the notes.”","options":["ends","will end","ended","has been ending"],"answer":0,"hint1":"“After” introduces a future time clause.","hint2":"Use present simple inside that clause.","explain":"“Ends” is the expected form.","deeper":"Future meaning does not force will into the dependent time clause.","mis":["","","",""]},{"id":"rv09","module":"review","skill":"future-choice","kind":"Retrieval revisit","prompt":"Which sentence best uses present evidence for a future prediction?","options":["The battery will die; I suppose batteries often do.","The battery dies tomorrow.","The battery will have died tomorrow.","The battery is going to die; the warning light is flashing red."],"answer":3,"hint1":"Look for evidence visible now.","hint2":"That pattern favours be going to in the supplied course convention.","explain":"“The battery is going to die” matches the visible warning-light evidence.","deeper":"This is a meaning distinction, not a ban on will.","mis":["","","",""]},{"id":"rv10","module":"review","skill":"pastperf-past","kind":"Retrieval revisit","prompt":"Which sentence correctly marks the earlier past event?","options":["When the doors had opened, the guests took their seats earlier.","When the doors opened, the guests took their seats earlier.","When the doors opened, the guests had already taken their seats.","When the doors have opened, the guests took their seats."],"answer":2,"hint1":"Which action happened before the doors opened?","hint2":"The earlier action needs had + participle.","explain":"“Had already taken” marks the earlier past event.","deeper":"Past perfect is useful because the order is not merely being narrated in sequence.","mis":["","","",""]},{"id":"rv11","module":"review","skill":"progressive-misuse","kind":"Retrieval revisit","prompt":"Which verb is most suspicious in formal writing?","options":["is running","is changing","is preparing","is owning"],"answer":3,"hint1":"Three describe actions/processes; one is a state from the memorise list.","hint2":"“Own” is stative.","explain":"“Is owning” is the suspicious progressive form.","deeper":"Always ask what the verb means in context.","mis":["","","",""]},{"id":"rv12","module":"review","skill":"presperfprog","kind":"Retrieval revisit","prompt":"Which form best fits an active process continuing “since dawn”?","options":["worked","has been working","is working","has worked"],"answer":1,"hint1":"The action began earlier and continues now.","hint2":"The ongoing process and duration are both important.","explain":"“Has been working” is the strongest fit.","deeper":"With a stative verb, present perfect may be preferable instead.","mis":["","","",""]},{"id":"rv13","module":"review","skill":"scheduled-future","kind":"Retrieval revisit","prompt":"Which sentence uses a fixed timetable correctly?","options":["The train will depart at 07:05 every weekday.","The train departs at 07:05 every weekday.","The train will have departed at 07:05 every weekday.","The train is departing at 07:05 every weekday."],"answer":1,"hint1":"This is a timetable, not a one-off prediction.","hint2":"Fixed schedules commonly stay in simple present.","explain":"“Departs” fits the timetable.","deeper":"Present progressive can express arrangements, but the course highlights simple present for fixed schedules.","mis":["","","",""]},{"id":"rv14","module":"review","skill":"transfer","kind":"Retrieval revisit","prompt":"Which sentence contains no tense error?","options":["The team had reviewed the figures before it approved the budget.","I have filed the claim yesterday.","When the bell will ring, the doors open.","The manager is knowing the answer."],"answer":0,"hint1":"Check each sentence against time markers, sequence, and stative verbs.","hint2":"Only one keeps a logical timeline and formal verb use.","explain":"“Had reviewed … before it approved” correctly marks the earlier review with past perfect and the later approval with simple past.","deeper":"Mixed practice removes the rule label so you must decide which relationship matters.","mis":["","","",""]},{"id":"rv15","module":"review","skill":"tense-model","kind":"Retrieval revisit","prompt":"Which sentence combines a perfect time link with an action still in progress up to a past reference point?","options":["The crew inspected the cables before dawn.","The crew had been inspecting the cables for two hours when dawn broke.","The crew was inspecting the cables at dawn.","The crew had inspected the cables before dawn."],"answer":1,"hint1":"Look for both duration and an earlier-to-later past link.","hint2":"You need had been + -ing plus a later past reference point.","explain":"Past perfect progressive combines the perfect link and progressive duration in the past.","deeper":"The form is useful when the continuing stretch of activity matters, not merely its completion.","mis":["","","",""]},{"id":"rv16","module":"review","skill":"present-family","kind":"Retrieval revisit","prompt":"Which sentence most naturally describes a temporary situation around now?","options":["The gallery uses the west entrance every winter.","The gallery has used the west entrance since 2018.","The gallery is using the west entrance while the main doors are repaired.","The gallery used the west entrance last winter."],"answer":2,"hint1":"A temporary present situation is not the same as a routine.","hint2":"Look for am/is/are + -ing around the present period.","explain":"“Is using” presents the entrance arrangement as temporary around now.","deeper":"Simple present would make it sound habitual rather than temporary.","mis":["","","",""]},{"id":"rv17","module":"review","skill":"past-family","kind":"Retrieval revisit","prompt":"Which sentence correctly uses simple past for a repeated action in a finished period?","options":["During her internship, Nadiya has checked the inventory every Friday.","During her internship, Nadiya is checking the inventory every Friday.","During her internship, Nadiya checked the inventory every Friday.","During her internship, Nadiya had been checking the inventory every Friday without another past reference point."],"answer":2,"hint1":"The internship is treated as a finished past period.","hint2":"A repeated action can still take simple past when the period has ended.","explain":"“Checked … every Friday” is a repeated completed action inside a finished past period.","deeper":"Simple past is not limited to one-time events; it also covers repeated actions and ended past states.","mis":["","","",""]},{"id":"rv18","module":"review","skill":"future-family","kind":"Retrieval revisit","prompt":"Which sentence shows two parallel activities that will be in progress at the same future time?","options":["At noon, one team will inspect the roof while another records measurements.","At noon, one team will be inspecting the roof while another will be recording measurements.","At noon, one team will have inspected the roof while another recorded measurements.","At noon, one team inspects the roof while another has recorded measurements."],"answer":1,"hint1":"Both activities should be pictured as unfolding at noon.","hint2":"Use future progressive for the parallel actions.","explain":"“Will be inspecting … will be recording” shows both future activities in progress together.","deeper":"Future progressive can describe a single future scene or parallel activities within that scene.","mis":["","","",""]},{"id":"rv19","module":"review","skill":"stative","kind":"Retrieval revisit","prompt":"Which sentence follows the course’s formal convention for “seem”?","options":["The estimate is seeming too optimistic.","The estimate has been seeming too optimistic.","The estimate seems too optimistic.","The estimate will be seeming too optimistic."],"answer":2,"hint1":"“Seem” is in the supplied stative list.","hint2":"Avoid the progressive form in formal written English here.","explain":"“Seems” is the expected formal form.","deeper":"The course treats listed stative verbs in progressive forms as suspicious even though real usage can vary with meaning and register.","mis":["","","",""]},{"id":"rv20","module":"review","skill":"consistency","kind":"Retrieval revisit","prompt":"Which sentence uses different tenses for a logical reason rather than by accident?","options":["The committee met yesterday and now reviewed the final draft.","The committee meets yesterday and reviewed the final draft.","The committee has met yesterday and is reviewing the final draft now.","The committee met yesterday and is reviewing the final draft now."],"answer":3,"hint1":"Different tense forms can be correct if the time really changes.","hint2":"Find the option that marks yesterday as past and now as present ongoing.","explain":"“Met yesterday” and “is reviewing … now” form a coherent two-time sequence.","deeper":"Consistency means logical time, not forcing every verb into one tense.","mis":["","","",""]},{"id":"rv21","module":"review","skill":"presperf-past","kind":"Retrieval revisit","prompt":"Which sentence correctly uses a time span that began earlier and still reaches the present?","options":["The studio has operated from this address since 2022.","The studio operated from this address since 2022.","The studio operates from this address yesterday.","The studio had operated from this address since 2022 and still does now."],"answer":0,"hint1":"“Since 2022” reaches from a starting point to now.","hint2":"A present perfect form can link that continuing state to the present.","explain":"“Has operated … since 2022” keeps the state connected to now.","deeper":"A finished past-time marker would push the sentence toward simple past instead.","mis":["","","",""]},{"id":"rv22","module":"review","skill":"sequence","kind":"Retrieval revisit","prompt":"Which sentence clearly marks the earlier of two past actions?","options":["The lights went out after the technician had isolated the circuit.","The lights had gone out after the technician isolated the circuit.","The lights have gone out after the technician isolated the circuit.","The lights were going out after the technician had isolated the circuit."],"answer":0,"hint1":"Ask which action happened first: isolating the circuit or the lights going out.","hint2":"The earlier action takes had + past participle.","explain":"“Had isolated” marks the earlier past action; “went out” remains simple past for the later event.","deeper":"Past perfect is useful when it establishes a real earlier-past relationship.","mis":["","","",""]},{"id":"rv23","module":"review","skill":"future-choice","kind":"Retrieval revisit","prompt":"Which sentence best expresses a future plan that is already decided?","options":["We will perhaps visit the supplier one day.","We have visited the supplier on Monday.","We are going to visit the supplier on Monday; the appointment is already booked.","We visited the supplier on Monday next week."],"answer":2,"hint1":"Look for a plan already formed before the moment of speaking.","hint2":"The booked appointment supports be going to.","explain":"“Are going to visit” fits an already-decided plan.","deeper":"The course uses be going to for formed plans and outcomes supported by present evidence.","mis":["","","",""]},{"id":"rv24","module":"review","skill":"pastperf-past","kind":"Retrieval revisit","prompt":"Which sentence avoids unnecessary past perfect in ordinary chronological narration?","options":["The workshop had opened in March and hired two apprentices in April.","The workshop has opened in March and hired two apprentices in April.","The workshop was opening in March and had hired two apprentices in April.","The workshop opened in March and hired two apprentices in April."],"answer":3,"hint1":"The dates already tell you the order.","hint2":"No later past reference point requires a look-back form.","explain":"Simple past is enough for two dated events narrated in order.","deeper":"Past perfect should earn its place by establishing a meaningful earlier-past relationship.","mis":["","","",""]},{"id":"rv25","module":"review","skill":"progressive-misuse","kind":"Retrieval revisit","prompt":"Which phrase is the clearest progressive misuse under the course’s formal convention?","options":["is preparing the schedule","is changing the schedule","is reviewing the schedule","is seeming uncertain"],"answer":3,"hint1":"Only one verb names a state from the supplied list.","hint2":"“Seem” is stative here.","explain":"“Is seeming” is the suspicious form; “seems” is the formal choice.","deeper":"Progressive is about an activity unfolding, so a state verb should trigger a check.","mis":["","","",""]},{"id":"rv26","module":"review","skill":"presperfprog","kind":"Retrieval revisit","prompt":"Which sentence best stresses an active process continuing from 8 a.m. until now?","options":["The technicians calibrated the meters since 8 a.m.","The technicians are calibrating the meters since 8 a.m.","The technicians have been calibrating the meters since 8 a.m.","The technicians have calibrated the meters since 8 a.m."],"answer":2,"hint1":"The action began earlier, still continues, and duration matters.","hint2":"Use have/has been + -ing for that combination.","explain":"“Have been calibrating” makes the ongoing process and its duration explicit.","deeper":"Present perfect can emphasise completion or a continuing state; perfect progressive foregrounds the continuing activity.","mis":["","","",""]},{"id":"rv27","module":"review","skill":"scheduled-future","kind":"Retrieval revisit","prompt":"Which sentence uses simple present naturally for a published future schedule?","options":["The seminar will begin at 9:30 on Friday according to the programme.","The seminar begins at 9:30 on Friday according to the programme.","The seminar has begun at 9:30 on Friday according to the programme.","The seminar began at 9:30 on Friday according to the programme."],"answer":1,"hint1":"The programme gives a fixed timetable.","hint2":"Published schedules commonly use simple present.","explain":"“Begins” is the standard timetable form here.","deeper":"A future date does not automatically require will when the sentence reports a fixed schedule.","mis":["","","",""]},{"id":"rv28","module":"review","skill":"transfer","kind":"Retrieval revisit","prompt":"Which sentence is correct as written?","options":["The analyst had compared the bids before the board made its decision.","The team has completed the test last night and files the results now.","Before the doors will close, the ushers will check every row.","The director is understanding the concern and will respond tomorrow."],"answer":0,"hint1":"Check finished past time, future time clauses, stative verbs, and past sequence.","hint2":"Only one sentence uses each tense for a defensible time relationship.","explain":"“Had compared … before the board made” correctly marks the earlier comparison and later decision.","deeper":"Mixed review works only when you identify the time relationship before reaching for a rule label.","mis":["","","",""]}];const errorLessons=[{"n":"01","title":"Inconsistent Tense Usage","skill":"consistency","how":"Put every verb on the actual timeline. A shift is wrong only when the sentence gives no time reason for it.","unsure":"Check time markers and context. A general truth or habit can remain in simple present even inside a past discussion."},{"n":"02","title":"Present Perfect vs Simple Past","skill":"presperf-past","how":"Use simple past for a completed event at a specific finished past time. Use present perfect when the earlier event is linked to now or the time period still reaches now.","unsure":"Specific finished past time → usually simple past. Since/for/already/yet/ever/never often support present perfect, but meaning still decides."},{"n":"03","title":"Incorrect Sequence of Tenses","skill":"sequence","how":"Identify the main and dependent clause, then place the events in order. Mark an earlier past action only where needed. In future time clauses, use present rather than will.","unsure":"Draw a two- or three-point timeline before touching the verbs."},{"n":"04","title":"Misuse of Future Tenses","skill":"future-choice","how":"Decide whether the future meaning is a general prediction, a planned/evidence-based outcome, an action in progress, or an action already complete by a future point.","unsure":"A future deadline with by/before/by the time often needs future perfect."},{"n":"05","title":"Past Perfect vs Simple Past","skill":"pastperf-past","how":"Past perfect marks the earlier of two meaningful past points. Do not use it for every event merely because it happened first in calendar order.","unsure":"If the sentence already narrates events in order and no later past reference point matters, simple past is usually enough."},{"n":"06","title":"Misuse of Progressive Tenses","skill":"progressive-misuse","how":"Ask whether the main verb describes an action/process or a state. The supplied stative list is rarely progressive in formal written English.","unsure":"If “right now” does not sensibly describe the verb as an unfolding activity, question the progressive form."},{"n":"07","title":"Present Perfect Progressive","skill":"presperfprog","how":"Use it for an active process that began in the past, continues now, and makes duration or ongoing activity important.","unsure":"Look for a stretch of time reaching the present. With stative verbs, present perfect may be the better form."},{"n":"08","title":"Present vs Future for Future Events","skill":"scheduled-future","how":"Fixed timetables commonly take simple present. Predictions and intentions normally need future meaning.","unsure":"Separate schedule from prediction. A sentence can legitimately use both present and future forms."}];
const allItems=[...activities,...reviewItems];const byId=id=>allItems.find(a=>a.id===id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);const routeIds=()=>new Set(modules.map(m=>m.id));
function defaultState(){return{version:COURSE_VERSION,lastRoute:'home',lastLearningRoute:'foundations',theme:'light',completed:{},attempts:{},mastery:Object.fromEntries(Object.keys(skillMeta).map(k=>[k,0])),review:{},mistakes:[],scroll:{},confidence:{},notes:{},labs:{},reviewCursor:{},reviewCredit:{}}}
function migrateState(old){const base=defaultState();if(!isObj(old))return base;const routes=routeIds();const safe={...base};safe.lastRoute=routes.has(old.lastRoute)?old.lastRoute:'home';safe.lastLearningRoute=routes.has(old.lastLearningRoute)&&old.lastLearningRoute!=='home'?old.lastLearningRoute:'foundations';safe.theme=old.theme==='focus'?'focus':'light';safe.completed=isObj(old.completed)?Object.fromEntries(Object.entries(old.completed).filter(([k,v])=>activities.some(a=>a.id===k)&&!!v)):{};safe.attempts=isObj(old.attempts)?Object.fromEntries(Object.entries(old.attempts).filter(([k,v])=>allItems.some(a=>a.id===k)&&Number.isFinite(Number(v))).map(([k,v])=>[k,Math.max(0,Math.floor(Number(v)))])):{};if(isObj(old.mastery))for(const k of Object.keys(skillMeta)){const n=Number(old.mastery[k]);if(Number.isFinite(n))safe.mastery[k]=clamp(n,0,100)}if(isObj(old.review))for(const [k,v] of Object.entries(old.review)){if(skillMeta[k]&&isObj(v)){const stage=clamp(Math.floor(Number(v.stage)||0),0,6),next=Number(v.next);safe.review[k]={stage,next:Number.isFinite(next)?Math.max(0,next):0}}}safe.mistakes=Array.isArray(old.mistakes)?old.mistakes.filter(x=>isObj(x)&&skillMeta[x.skill]).slice(0,60):[];safe.scroll=isObj(old.scroll)?Object.fromEntries(Object.entries(old.scroll).filter(([k,v])=>routes.has(k)&&Number.isFinite(Number(v))).map(([k,v])=>[k,Math.max(0,Number(v))])):{};safe.confidence=isObj(old.confidence)?old.confidence:{};safe.notes=isObj(old.notes)?Object.fromEntries(Object.entries(old.notes).filter(([,v])=>typeof v==='string').map(([k,v])=>[k,v.slice(0,20000)])):{};safe.labs=isObj(old.labs)?old.labs:{};safe.reviewCursor=isObj(old.reviewCursor)?old.reviewCursor:{};safe.reviewCredit=isObj(old.reviewCredit)?old.reviewCredit:{};return safe}
function loadState(){try{let raw=localStorage.getItem(COURSE_KEY);if(!raw){for(const k of LEGACY_KEYS){raw=localStorage.getItem(k);if(raw)break}}return raw?migrateState(JSON.parse(raw)):defaultState()}catch(e){return defaultState()}}
let state=loadState(),saveTimer;function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveState,100)}function saveState(){try{localStorage.setItem(COURSE_KEY,JSON.stringify(state))}catch(e){}}
function scoreSkill(skill,delta){state.mastery[skill]=clamp((state.mastery[skill]||0)+delta,0,100)}function awardSkill(a,delta){if(a.module==='review'&&delta>0){const last=Number(state.reviewCredit[a.skill]||0);if(Date.now()-last<6*3600000)return 0;state.reviewCredit[a.skill]=Date.now()}scoreSkill(a.skill,delta);return delta}
function scheduleReview(skill,quality,conf='medium'){const r=state.review[skill]||{stage:0,next:0};let stage=quality==='strong'?Math.min(6,r.stage+1):Math.max(0,r.stage-1);const days=[0,1,3,7,14,30,60][stage];let mult=conf==='low'?.45:conf==='high'?1.15:1;state.review[skill]={stage,next:Date.now()+days*86400000*mult}}
function recordMistake(a,choice){const tag=a.mis?.[choice]||'unspecified';state.mistakes.unshift({id:a.id,skill:a.skill,tag,at:Date.now()});state.mistakes=state.mistakes.slice(0,60)}
function mainActivities(){return activities}function totalProgress(){return Math.round(Object.keys(state.completed).filter(id=>activities.some(a=>a.id===id)).length/Math.max(1,activities.length)*100)}
function moduleProgress(id){const list=activities.filter(a=>a.module===id);if(!list.length)return id==='home'?100:0;return Math.round(list.filter(a=>state.completed[a.id]).length/list.length*100)}
